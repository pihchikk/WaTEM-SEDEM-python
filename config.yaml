# 1. GENERAL SETTINGS
version: 1.0
mode: external  # choose one of:
                #
                # external: (when you have all the input files)
                #   – WaTEM covariates must be present as files; error if any are missing
                #   – DTM covariates must be present as files; error if any are missing
                #
                # hybrid: (most flexible - e.g. when you have some input files and/or don't mind replacing WaTEM-SEDEM inputs with scalar values. 
                # Can work with a single DTM with no other files present using scalars)
                #   – WaTEM: load external covariates; fall back to default scalars if missing
                #   – DTM: load external covariates; compute any missing ones
                #
                # user_dtm: (when you have pre-computed DTM-derived covariates, but have no WaTEM-SEDEM-specific covariates - Cfactor, Pfactor, ktc, etc.)
                #   – WaTEM: compute any missing covariates on the fly or fallback to scalars if no watem input is given
                #   – DTM: require external covariates; error if any are missing
                #
                # user_watem: (when you have pre-computed watemsedem rasters but lack DTM-derived covariates - slope, flow_direction etc.)
                #   – WaTEM: require external covariates; error if any are missing
                #   – DTM: compute any missing covariates on the fly
                #
                # internal: (when you only have dtm, catchment mask, landuse, Kfactor and river vector/raster) 
                #   – WaTEM: compute all covariates regardless of existing files
                #   – DTM: compute all covariates regardless of existing files



# 1.0 SCENARIO METADATA (for any on-the-fly pywatemsedem preprocessing)
scenario_year:    2025          # simulation year
scenario_nr:      1             # scenario number

raster_dir:        "./data/rasters"        # where model-ready rasters live
segment_tables_dir: "./data/segments"       # where adjacency/upstream tables go

# 1.1 PyWaTEM-SEDEM INPUTS
raw_input_dir:     "./data/pywatemsedem_input"  # folder containing source data
raw_inputs:
  elevation:        "elevation.tif"            # required: DTM (m)
  catchment:        "catchment.shp"            # required: catchment outline
  landuse:          "landuse.tif"              # optional: derive Cfactor if needed
  Kfactor:          "Kfactor.tif"              # optional: soil erodibility map
  river:            "river.shp"                # optional: channel network
  water:            "water.shp"                # optional: lakes/wetlands mask
  infrastructure:   "infrastructure.shp"       # optional: impervious areas

# PyWaTEM-SEDEM output folder settings
catchment_name:    "sample_catchment"         # name used for Catchment subfolder
pyws_output_dir:    "./pywatemsedem_preprocessed_rasters"     # root folder for pywatemsedem

dtm_resolution:    20
dtm_epsg:          32637
dtm_nodata:        -9999

# 1.2 Which extensions to try for every raster basename
extensions:
  - ".tif"
  - ".tiff"
  - ".rst"
  - ".nc"

# 2. MODEL LAYERS (what WaTEM-SEDEM consumes)
#   source: external|compute|auto  
#     external = only load, or fallback to default scalar  
#     compute  = always compute from DTM  
#     auto     = prefer external, else compute_from_dtm

layers:
  elevation:
    required: true
    source: external
    # units: meters (m)

  Rfactor:
    required: false
    source: auto
    # units: MJ·mm·ha⁻¹·h⁻¹·yr⁻¹

  bulk-density:
    required: false
    source: external
    # units: kg·m⁻³

  Kfactor:
    required: true
    source: auto
    # units: t·ha⁻¹·MJ⁻¹·mm⁻¹

  Cfactor:
    required: false
    source: auto
    # dimensionless

  Pfactor:
    required: false
    source: auto
    # dimensionless

  ktc:
    required: false
    source: auto
    # dimensionless

  slope:
    required: true
    source: auto
    # units: radians

  flow_accumulation:
    required: true
    source: auto
    # units: m²

  aspect:
    required: true
    source: auto
    # units: radians

  slope_length:
    required: true
    source: auto
    # units: m

  flow_direction:
    required: true
    source: auto
    # D8 codes (0–7)

  routing:
    required: false
    source: external
    # optional D8/network routing code (integer)

  segments:
    required: false
    source: external
    # optional segment ID per cell (int16)

  outlet:
    required: false
    source: external
    # optional outlet mask or segment ID (integer)

  LS-factor:
    required: true
    source: auto
    # dimensionless (RUSLE L×S factor)

# 3. DEFAULT SCALARS (fallback when external rasters missing) - sets a single scalar value for the covariate within the region of interest (catchment mask)
defaults:
  Cfactor:      0.37       # dimensionless (set for cropland, refer to https://watem-sedem.github.io/)
  Kfactor:      70         # t·ha⁻¹·MJ⁻¹·mm⁻¹ (set for consistency as in pywatemsedem, refer to https://watem-sedem.github.io/)
  Pfactor:      1          # dimensionless
  Rfactor:      350.0      # MJ·mm·ha⁻¹·h⁻¹·yr⁻¹
  bulk-density: 1300.0     # kg·m⁻³
  ktc:          250        # metres (overridden by calibration.ktc_low/high)

calibration:
  # Transport-capacity coefficients, in METRES. ktc_limit is a threshold on the
  # C factor, not a coefficient: cells with C below it use ktc_low, the rest
  # ktc_high. These are the WaTEM/SEDEM desktop defaults.
  ktc_low:   75
  ktc_high:  250
  ktc_limit: 0.1

# Sediment routing scheme.
#   d8:  a cell's whole outflow goes to one neighbour (SAGA's D8 grid).
#   mfd: outflow is split across all downslope neighbours, weighted by
#        gradient**mfd_exponent, and the upslope area feeding the LS factor is
#        routed the same way. This is what the original WaTEM/SEDEM software
#        does. Measured against its output on the lom and spok reference
#        catchments, mfd raises top-decile erosion IoU from 0.478/0.556 to
#        0.744/0.730 and Spearman rho from 0.818/0.874 to 0.895/0.932
#        The modeller who produced those references confirmed the desktop
#        software spreads flow over several directions, so mfd is the default.
routing_scheme: desmet_govers
mfd_exponent: 1.0

# LS-factor formulation. One of: wischmeier, mccool, govers, nearing,
# pascal_vanoost2003, pascal_mccool1987, pascal_nearing1997.
ls_method: pascal_mccool1987

# EPOCH COUPLING (AquaCrop + LISEM → WaTEM-SEDEM)
# See docs/COUPLING_VARS_LEDGER.md for the full division of labor and caveats.
coupling_mode: static
  # static: current stand-alone behavior — default scalar/raster Cfactor/Rfactor from
  #         this file, unchanged. Use this for the baseline run in the comparison harness.
  # epoch:  one update() per AquaCrop growing season; Cfactor/Rfactor are derived from
  #         a coupled run's daily outputs via src/coupling_drivers.py.
  # event:  one update() per rainfall event identified from the daily rain series;
  #         lower priority, see disable_if_lisem_covers_event below.

flow_direction_source: internal
  # internal: WaTEM-SEDEM derives its own D8 grid from the DTM (current/default behavior).
  # external: ingest a pre-computed flow-direction raster (e.g. LISEM's routed grid) via
  #           external_flow_direction_path instead — required when both models cover the
  #           same catchment so sediment routing agrees between them.
external_flow_direction_path: null   # path to raster; required if flow_direction_source: external

# event-mode only: when true, update() logs a warning and skips the erosion solve for any
# day/window already covered by an active LISEM event run, instead of double-counting the
# same storm. Seasonal-epoch mode is inherently non-overlapping with LISEM's per-storm
# accounting, so this flag has no effect there.
disable_if_lisem_covers_event: true

# 4. DTM COVARIATES (which layers can be derived from the DTM)
dtm_covariates:
  slope:             true
  aspect:            true
  flow_accumulation: true
  slope_length:      true
  flow_direction:    true
  LS-factor:         true

# 5. OUTPUT SETTINGS
output:
  directory:     "./results"   # where to write outputs
  format:        "tif"         # rst | tif 

  sediment_unit: "kg"          # "m3", "kg" (per cell), or "t/ha"
  erosion_unit:  "kg"          # "m", "mm", "kg" (per cell), or "t/ha"

  save_rasters:  true          # write SEDI_OUT, CAPACITY, WATEREROS
  save_plots:    true          # save maps.png instead of interactive display
