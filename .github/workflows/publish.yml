name: publish

# Pure Python, so one universal wheel -- no build matrix, no auditwheel.
#
# Publishing uses trusted publishing (OIDC): no API token in repository secrets.
# The registered TestPyPI publisher is
#
#     project     bmi-WaTEM-SEDEM        (normalises to bmi-watem-sedem)
#     repository  pihchikk/bmi-WaTEM-SEDEM
#     workflow    publish.yml
#     environment bmi-watem-sedem
#
# and all four have to match or the upload is rejected with "invalid-publisher".
# The repository line is the one to watch: OIDC carries the name of the repo
# actually running the workflow, so this must run from a repo named
# bmi-WaTEM-SEDEM. If it still lives at WaTEM-SEDEM-python, either rename the
# repo on GitHub (redirects are kept) or edit the publisher on TestPyPI.
#
#   tag v*                       -> TestPyPI
#   workflow_dispatch            -> TestPyPI by default, PyPI on request
#
# Production PyPI has no publisher registered yet; selecting it will fail the
# same way until one exists.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A tag run may already be uploading; cancelling a half-finished publish is
  # worse than letting a redundant build finish.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          ls -la dist/

      - name: Check the version matches the tag
        # A tag that disagrees with pyproject.toml publishes a release nobody
        # can find by the name they were given.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag $TAG, pyproject $VER"
          test "$TAG" = "$VER"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish_test:
    name: TestPyPI
    needs: [build]
    if: >-
      github.event_name == 'push' ||
      inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: bmi-watem-sedem      # must match the registered publisher
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish:
    name: PyPI
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: bmi-watem-sedem
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
