name: publish

# Pure Python, so one universal wheel -- no build matrix, no auditwheel.
#
# Two ways to authenticate, and the workflow takes whichever is available.
#
# 1. An API token in repository secrets -- TEST_PYPI_API_TOKEN for TestPyPI,
#    PYPI_API_TOKEN for PyPI. Create it on the index (Account settings -> API
#    tokens), paste it into Settings -> Secrets and variables -> Actions. This
#    path has nothing to match and nothing to get wrong.
#
# 2. Trusted publishing (OIDC), used automatically when the secret is empty.
#    No token anywhere, but the publisher registered on the index must match
#    every OIDC claim GitHub sends:
#
#        repository   pihchikk/bmi-watem-sedem
#        workflow     publish.yml
#        environment  bmi-watem-sedem
#        project      bmi-watem-sedem   (pyproject says bmi-WaTEM-SEDEM; PyPI
#                                        normalises it to this)
#
#    If the exchange is refused with `invalid-publisher`, the action prints the
#    claims it sent: compare them against the publisher character by character.
#    Two things that look right but are not: a publisher created on pypi.org
#    when the upload targets test.pypi.org (they are separate accounts and
#    separate publisher lists), and a re-run of an already-failed job, which
#    replays the old claims and fails identically no matter what was fixed
#    since -- push a new tag instead.
#
# Note that `workflow_dispatch` only appears in the Actions UI once this file is
# on the DEFAULT branch. Until this branch is merged, a tag is the only way to
# trigger it -- which is why tags publish to TestPyPI here.
#
#   tag v*                       -> TestPyPI
#   workflow_dispatch            -> TestPyPI by default, PyPI on request
#
# Production PyPI has no publisher registered yet; selecting it will fail the
# same way until one exists.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A tag run may already be uploading; cancelling a half-finished publish is
  # worse than letting a redundant build finish.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          ls -la dist/

      - name: Check the version matches the tag
        # A tag that disagrees with pyproject.toml publishes a release nobody
        # can find by the name they were given.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag $TAG, pyproject $VER"
          test "$TAG" = "$VER"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish_test:
    name: TestPyPI
    needs: [build]
    if: >-
      github.event_name == 'push' ||
      inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: bmi-watem-sedem      # must match the registered publisher
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          # Empty secret -> the action falls back to trusted publishing.
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish:
    name: PyPI
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: bmi-watem-sedem
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
