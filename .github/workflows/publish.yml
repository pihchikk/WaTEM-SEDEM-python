name: publish

# Pure Python, so one universal wheel -- no build matrix, no auditwheel.
#
# Publishing uses trusted publishing (OIDC): no API token in repository secrets.
# The publisher on the index must match the OIDC claims GitHub sends, all four:
#
#     repository   pihchikk/bmi-watem-sedem     <- lowercase, exactly as GitHub
#                                                  stores it after the rename
#     workflow     publish.yml
#     environment  bmi-watem-sedem
#     project      bmi-watem-sedem              (pyproject says bmi-WaTEM-SEDEM;
#                                                PyPI normalises it to this)
#
# The repository claim is case-sensitive and it is what bit us: a publisher
# registered as `bmi-WaTEM-SEDEM` was rejected with `invalid-publisher` while
# GitHub was sending `bmi-watem-sedem`. Everything else matched. If the exchange
# fails, read the claims the action prints and compare them character by
# character with the publisher -- the failure is a mismatch, not a build error.
#
# Note that `workflow_dispatch` only appears in the Actions UI once this file is
# on the DEFAULT branch. Until this branch is merged, a tag is the only way to
# trigger it -- which is why tags publish to TestPyPI here.
#
#   tag v*                       -> TestPyPI
#   workflow_dispatch            -> TestPyPI by default, PyPI on request
#
# Production PyPI has no publisher registered yet; selecting it will fail the
# same way until one exists.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A tag run may already be uploading; cancelling a half-finished publish is
  # worse than letting a redundant build finish.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          ls -la dist/

      - name: Check the version matches the tag
        # A tag that disagrees with pyproject.toml publishes a release nobody
        # can find by the name they were given.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag $TAG, pyproject $VER"
          test "$TAG" = "$VER"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish_test:
    name: TestPyPI
    needs: [build]
    if: >-
      github.event_name == 'push' ||
      inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: bmi-watem-sedem      # must match the registered publisher
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish:
    name: PyPI
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: bmi-watem-sedem
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
