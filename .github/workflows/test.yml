name: test

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:

# A superseded run tells you nothing and the geospatial wheel set is not cheap
# to install twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: System dependencies (GDAL + SAGA GIS)
        # SAGA is what the DTM-covariate tests need; without it they skip
        # rather than fail, but then hybrid/user_watem/user_dtm go unexercised.
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing libgdal-dev gdal-bin saga
          saga_cmd --version | head -2

      - name: Install the package
        # Installing it, rather than putting the source tree on PYTHONPATH, is
        # what makes the console entry point and the packaging metadata part of
        # what CI covers. This used to be `PYTHONPATH=src`, pointing at a
        # directory that no longer exists.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[preprocess,plots]"
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v
