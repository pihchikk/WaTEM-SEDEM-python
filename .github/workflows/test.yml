name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (GDAL + SAGA GIS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing libgdal-dev gdal-bin saga

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: ${{ github.workspace }}
        run: |
          PYTHONPATH=src python -m pytest tests/ -v
