[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watem-sedem-bmi"
version = "0.1.0"
description = "BMI wrapper for the WaTEM-SEDEM soil erosion / sediment transport model"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "rasterio>=1.3",
    "affine>=2.4",
    "bmipy>=2.0",
    "geopandas>=0.14",
    "fiona>=1.9",
    "shapely>=2.0",
    "pyproj>=3.4",
    "pywatemsedem",
    "netCDF4>=1.6",
    "pandas",
]

[project.optional-dependencies]
# Only needed for run_watem.py's plotting output (config: output.save_plots).
plots = ["matplotlib>=3.4", "brokenaxes>=0.6"]

[project.scripts]
watem-sedem = "run_watem:main"

# Flat top-level modules, deliberately: src/ currently uses flat intra-package
# imports (`import data_loader`, `from lateraldistribution import ...`) and both
# tests/ and the documented `python src/run_watem.py` entry point rely on that.
# Packaging these as top-level modules keeps every existing usage working with
# zero source changes.
#
# The cleaner long-term shape is a real namespace (`watem_sedem.data_loader`,
# etc.), but that changes documented usage and breaks tests/ as written, so it's
# the model owner's call, not something to slip in with packaging.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "bmi_watem",
    "data_loader",
    "lateraldistribution",
    "raster_calculations",
    "compute_dtm",
    "preprocess_watem",
    "coupling_drivers",
    "run_watem",
]
